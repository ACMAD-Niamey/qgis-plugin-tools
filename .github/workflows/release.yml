name: Release

# Builds the installable plugin zip via scripts/package.sh (the single
# source of truth for packaging, also used for manual/local releases) and,
# when triggered by a version tag, publishes it as a GitHub Release.
#
# workflow_dispatch lets someone build and download a sanity-check zip
# on demand, without cutting a real tagged release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write # required to create a GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from metadata.txt
        id: version
        run: |
          VERSION="$(./scripts/package.sh --version)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Plugin version: ${VERSION}"

      - name: Verify tag matches metadata.txt version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_NAME#v}"
          METADATA_VERSION="${{ steps.version.outputs.version }}"

          if [[ "${TAG_VERSION}" != "${METADATA_VERSION}" ]]; then
            echo "::error::Tag '${TAG_NAME}' (version '${TAG_VERSION}') does not match metadata.txt version '${METADATA_VERSION}'. Update acmad_tools/metadata.txt's version= line to match the tag before releasing."
            exit 1
          fi

          echo "Tag version matches metadata.txt version (${METADATA_VERSION})."

      - name: Build plugin zip
        run: ./scripts/package.sh

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/acmad_tools-*.zip
          generate_release_notes: true

      - name: Upload build artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: acmad_tools-${{ steps.version.outputs.version }}
          path: dist/acmad_tools-*.zip
